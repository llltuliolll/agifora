{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-header">
  <div class="container">
    <h1>{{ titulo }}</h1>
  </div>
</div>
<div class="container pb-5" style="max-width:640px">
  <div class="card-agifora">
    <div class="card-body-agifora">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
          <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn-primary-agifora">Salvar</button>
          <a href="{% url 'core:credores_lista' %}" class="btn-outline-agifora">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
